name: Format PR 53
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  push:
    branches:
      - fix/country-economy-map-orders

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'style: format PR files'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || 'fix/country-economy-map-orders' }}
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Format changed source and test files
        run: |
          pnpm exec prettier --write \
            packages/auth/src/campaigns.ts \
            packages/persistence/src/postgres/turn-processing.ts \
            packages/worker/src/baseline-ruleset.ts \
            packages/worker/src/worker.ts \
            packages/world/src/country-setup.ts \
            tests/simulation/baseline-resolver.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add packages/auth/src/campaigns.ts \
              packages/persistence/src/postgres/turn-processing.ts \
              packages/worker/src/baseline-ruleset.ts \
              packages/worker/src/worker.ts \
              packages/world/src/country-setup.ts \
              tests/simulation/baseline-resolver.test.ts
            git commit -m "style: format PR files"
            target_branch="${{ github.event.pull_request.head.ref || 'fix/country-economy-map-orders' }}"
            git push origin HEAD:"$target_branch"
          fi
