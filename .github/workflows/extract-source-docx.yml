name: Temporary source DOCX extraction
on:
  push:
    branches:
      - stage-2-country-setup
    paths:
      - .github/workflows/extract-source-docx.yml
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract document text
        shell: bash
        run: |
          python - <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from zipfile import ZipFile

          W = "{http://schemas.openxmlformats.org/wordprocessingml/2006/main}"
          files = [
              "VK_discussions_205658089_2026-11-20.docx",
              "VK_wall_205658089_2026-11-20.docx",
          ]
          out = Path("/tmp/source-docx")
          out.mkdir(parents=True, exist_ok=True)
          pattern = re.compile(
              r"религ|идеолог|веро|божеств|атеизм|культ|систем|созда|основан|"
              r"общин|доктрин|церков|учен|сект|пантеон|народн|свят|духов|бог|"
              r"relig|ideolog|faith|belief|deit|worship|cult",
              re.IGNORECASE,
          )

          def paragraph_text(node):
              return "".join((t.text or "") for t in node.iter(W + "t")).strip()

          for filename in files:
              with ZipFile(filename) as archive:
                  root = ET.fromstring(archive.read("word/document.xml"))
              body = root.find(W + "body")
              rows = []
              if body is not None:
                  for child in body:
                      if child.tag == W + "p":
                          value = paragraph_text(child)
                          if value:
                              rows.append(value)
                      elif child.tag == W + "tbl":
                          for row in child.findall(W + "tr"):
                              cells = []
                              for cell in row.findall(W + "tc"):
                                  value = " / ".join(
                                      filter(None, (paragraph_text(p) for p in cell.findall(W + "p")))
                                  )
                                  cells.append(value)
                              value = " | ".join(cells).strip()
                              if value:
                                  rows.append("[TABLE] " + value)
              target = out / (filename + ".txt")
              target.write_text("\\n".join(rows), encoding="utf-8")
              matched = [i for i, value in enumerate(rows) if pattern.search(value)]
              print(f"===== {filename}: {len(rows)} blocks, {len(matched)} keyword matches =====")
              # Include a small amount of context around every relevant paragraph.
              selected = set()
              for i in matched:
                  selected.update(range(max(0, i - 1), min(len(rows), i + 2)))
              previous = -2
              for i in sorted(selected):
                  if i > previous + 1:
                      print("---")
                  print(f"[{i + 1}] {rows[i]}")
                  previous = i
              print(f"===== END {filename} =====")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: source-docx-extract
          path: /tmp/source-docx/*.txt
          retention-days: 1
