name: CI

on:
  push:
    branches:
      [
        main,
        stage-1.1-monorepo,
        stage-1.2-postgres-foundation,
        stage-1.3-rng-seed-commit-reveal,
        stage-1.4-auth-campaign-lifecycle,
        stage-1.5-domain-ruleset-contracts,
      ]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_USER: paperwars
          POSTGRES_PASSWORD: paperwars
          POSTGRES_DB: paperwars_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paperwars -d paperwars_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://paperwars:paperwars@127.0.0.1:5432/paperwars_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Temporary archive rules scan
        run: |
          python3 - <<'PY'
          import re
          import zipfile
          import xml.etree.ElementTree as ET

          namespace = {'w': 'http://schemas.openxmlformats.org/wordprocessingml/2006/main'}
          patterns = re.compile(r'теплиц|дамб|рыбак|рыболов|рыболовств|рыбн', re.IGNORECASE)
          for filename in [
              'VK_discussions_205658089_2026-11-20.docx',
              'VK_wall_205658089_2026-11-20.docx',
          ]:
              print(f'===== ARCHIVE {filename} =====')
              with zipfile.ZipFile(filename) as archive:
                  root = ET.fromstring(archive.read('word/document.xml'))
                  paragraphs = [
                      ''.join(node.itertext()).strip()
                      for node in root.findall('.//w:p', namespace)
                  ]
                  print(f'paragraphs={len(paragraphs)} media={len([name for name in archive.namelist() if name.startswith("word/media/")])}')
                  hits = 0
                  for index, paragraph in enumerate(paragraphs):
                      if not patterns.search(paragraph):
                          continue
                      hits += 1
                      print(f'--- paragraph {index} ---')
                      print(paragraph[:5000])
                  print(f'targeted_paragraphs={hits}')
          PY

      - name: Temporary archive science scan
        run: |
          python3 - <<'PY'
          import re
          import zipfile
          import xml.etree.ElementTree as ET

          namespace = {'w': 'http://schemas.openxmlformats.org/wordprocessingml/2006/main'}
          science = re.compile(r'наук|лаборатор', re.IGNORECASE)
          buildings = re.compile(r'рисов|теплиц|дамб|плотин|рыб|рыболов|поле|завод|мастерск|порт|источник|саке|хлоп|фабрик', re.IGNORECASE)
          for filename in [
              'VK_discussions_205658089_2026-11-20.docx',
              'VK_wall_205658089_2026-11-20.docx',
          ]:
              print(f'===== SCIENCE REFERENCES {filename} =====')
              with zipfile.ZipFile(filename) as archive:
                  root = ET.fromstring(archive.read('word/document.xml'))
                  paragraphs = [
                      ''.join(node.itertext()).strip()
                      for node in root.findall('.//w:p', namespace)
                  ]
                  hits = 0
                  for index, paragraph in enumerate(paragraphs):
                      if science.search(paragraph) and buildings.search(paragraph):
                          hits += 1
                          print(f'--- paragraph {index} ---')
                          print(paragraph[:6000])
                  print(f'science_building_paragraphs={hits}')
          PY
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm -r --workspace-concurrency=1 --if-present typecheck
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Tests
        run: pnpm --filter @paper-wars/tests test
