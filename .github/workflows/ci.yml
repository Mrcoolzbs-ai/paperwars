name: CI

on:
  push:
    branches:
      [
        main,
        stage-3-browser-client,
        stage-2-country-setup,
        stage-1.1-monorepo,
        stage-1.2-postgres-foundation,
        stage-1.3-rng-seed-commit-reveal,
        stage-1.4-auth-campaign-lifecycle,
        stage-1.5-domain-ruleset-contracts,
      ]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_USER: paperwars
          POSTGRES_PASSWORD: paperwars
          POSTGRES_DB: paperwars_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paperwars -d paperwars_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://paperwars:paperwars@127.0.0.1:5432/paperwars_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm -r --workspace-concurrency=1 --if-present typecheck
      - name: Lint
        run: pnpm lint
      - name: Capture exact Prettier output for order lifecycle files
        run: |
          pnpm exec prettier --write apps/api/src/app.ts packages/auth/src/campaigns.ts packages/persistence/src/postgres/turn-processing.ts tests/smoke/api-auth.test.ts tests/smoke/turn-processing.test.ts
          echo '=== SOURCE_0_START ==='
          cat apps/api/src/app.ts
          echo '=== SOURCE_0_END ==='
          echo '=== SOURCE_1_START ==='
          cat packages/auth/src/campaigns.ts
          echo '=== SOURCE_1_END ==='
          echo '=== SOURCE_2_START ==='
          cat packages/persistence/src/postgres/turn-processing.ts
          echo '=== SOURCE_2_END ==='
          echo '=== SOURCE_3_START ==='
          cat tests/smoke/api-auth.test.ts
          echo '=== SOURCE_3_END ==='
          echo '=== SOURCE_4_START ==='
          cat tests/smoke/turn-processing.test.ts
          echo '=== SOURCE_4_END ==='
      - name: Format check
        run: pnpm format:check
      - name: Tests
        run: pnpm --filter @paper-wars/tests test
