name: CI

on:
  push:
    branches:
      [
        main,
        stage-1.1-monorepo,
        stage-1.2-postgres-foundation,
        stage-1.3-rng-seed-commit-reveal,
        stage-1.4-auth-campaign-lifecycle,
        stage-1.5-domain-ruleset-contracts,
        stage-1.7-simulation-engine-skeleton,
        stage-1.8-turn-processing,
      ]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_USER: paperwars
          POSTGRES_PASSWORD: paperwars
          POSTGRES_DB: paperwars_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U paperwars -d paperwars_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://paperwars:paperwars@127.0.0.1:5432/paperwars_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build
        run: pnpm build
      - name: Typecheck
        run: pnpm -r --workspace-concurrency=1 --if-present typecheck
      - name: Lint
        run: pnpm lint
      - name: Format check
        run: pnpm format:check
      - name: Tests
        run: pnpm --filter @paper-wars/tests test
