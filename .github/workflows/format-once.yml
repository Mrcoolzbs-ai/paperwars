name: One-time format

on:
  push:
    branches: [feat/vk-first-player-profiles]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/vk-first-player-profiles
          persist-credentials: true
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Format changed TypeScript and remove this one-time workflow
        shell: bash
        run: |
          pnpm exec prettier --write "**/*.{ts,tsx,js,cjs,mjs,yml,yaml}" "package.json" "tsconfig.base.json" ".prettierrc.json"
          rm .github/workflows/format-once.yml
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply repository Prettier formatting"
          git push origin HEAD:feat/vk-first-player-profiles
