name: One-time formatting repair

on:
  push:
    branches: [stage-3-browser-client]
    paths: ['.github/workflows/format-fix.yml']

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Format changed source and integration test files
        run: pnpm exec prettier --write apps/api/src/app.ts packages/world/src/country-setup.ts tests/smoke/country-setup-api.test.ts
      - name: Commit formatting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/app.ts packages/world/src/country-setup.ts tests/smoke/country-setup-api.test.ts
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "style: format country actions implementation"
            git push "https://x-access-token:$GH_TOKEN@github.com/Mrcoolzbs-ai/paperwars.git" HEAD:stage-3-browser-client
          fi
