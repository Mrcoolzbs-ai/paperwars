name: Temporary Prettier formatting fix
on:
  push:
    branches:
      - stage-2-country-setup
    paths:
      - .github/workflows/format-fix.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage-2-country-setup
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Format changed files
        run: >-
          pnpm exec prettier --write
          apps/api/src/app.ts
          packages/persistence/src/postgres/schema.ts
          packages/world/src/country-setup.ts
          tests/smoke/country-setup-api.test.ts
          tests/smoke/country-setup.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/app.ts packages/persistence/src/postgres/schema.ts packages/world/src/country-setup.ts tests/smoke/country-setup-api.test.ts tests/smoke/country-setup.test.ts
          git commit -m "style: format social system lifecycle implementation"
          git push origin HEAD:stage-2-country-setup
