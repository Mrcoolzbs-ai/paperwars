name: Temporary format fix

on:
  push:
    branches: [stage-3-browser-client]

permissions:
  contents: write
  workflows: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Format changed TypeScript files
        run: pnpm exec prettier --write apps/api/src/app.ts tests/smoke/web-client.test.ts
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/api/src/app.ts tests/smoke/web-client.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format browser client routes and tests"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
