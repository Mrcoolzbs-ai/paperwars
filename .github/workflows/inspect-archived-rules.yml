name: Inspect archived Paper Wars rules
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect-docx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect research rules and source building illustrations
        shell: bash
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          import base64
          import re
          import zipfile
          import xml.etree.ElementTree as ET
          from io import BytesIO
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          path = next(Path('.').glob('VK_*.docx'))
          ns = {
              'w': 'http://schemas.openxmlformats.org/wordprocessingml/2006/main',
              'a': 'http://schemas.openxmlformats.org/drawingml/2006/main',
              'r': 'http://schemas.openxmlformats.org/officeDocument/2006/relationships',
          }
          terms = re.compile(
              r'наук|лаборатор|исслед|технолог|теплиц|дамб|рисов|хлоп|швейн|'
              r'горяч|термальн|саке|требуется.{0,20}наук|наук.{0,20}требуется',
              re.IGNORECASE
          )
          with zipfile.ZipFile(path) as archive:
              root = ET.fromstring(archive.read('word/document.xml'))
              rel_root = ET.fromstring(archive.read('word/_rels/document.xml.rels'))
              rels = {rel.attrib['Id']: rel.attrib['Target'] for rel in rel_root}
              paragraphs = []
              for p in root.findall('.//w:p', ns):
                  value = ''.join(node.text or '' for node in p.findall('.//w:t', ns)).strip()
                  embeds = [node.attrib.get('{%s}embed' % ns['r']) for node in p.findall('.//a:blip', ns)]
                  targets = [rels.get(embed) for embed in embeds if embed and rels.get(embed)]
                  if value or targets:
                      paragraphs.append((value, targets))
              for i, (value, targets) in enumerate(paragraphs):
                  if value and terms.search(value):
                      print(f'RULE P{i+1}: {value}')
                  if targets and (i < 60 or (value and terms.search(value))):
                      print(f'IMAGE P{i+1}: {value[:160]} -> {targets}')
              media_names = [n for n in archive.namelist()
                             if n.startswith('word/media/') and not n.endswith('/')]
              thumbs = []
              for name in media_names:
                  try:
                      image = Image.open(BytesIO(archive.read(name))).convert('RGB')
                      image.thumbnail((108, 74))
                      tile = Image.new('RGB', (126, 102), 'white')
                      tile.paste(image, ((126-image.width)//2, 2))
                      draw = ImageDraw.Draw(tile)
                      draw.text((3, 80), name.split('/')[-1], fill='black')
                      thumbs.append(tile)
                  except Exception:
                      pass
              cols = 8
              rows = (len(thumbs) + cols - 1) // cols
              sheet = Image.new('RGB', (cols*126, rows*102), '#d9dfe3')
              for index, thumb in enumerate(thumbs):
                  sheet.paste(thumb, ((index % cols)*126, (index // cols)*102))
              buffer = BytesIO()
              sheet.save(buffer, format='JPEG', quality=68, optimize=True)
              print('CONTACT_SHEET_BASE64_START')
              print(base64.b64encode(buffer.getvalue()).decode('ascii'))
              print('CONTACT_SHEET_BASE64_END')
              print(f'CONTACT_SHEET_SIZE: {sheet.size}, MEDIA_COUNT: {len(media_names)}')
          PY
