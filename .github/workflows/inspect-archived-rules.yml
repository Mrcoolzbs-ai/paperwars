name: Inspect archived Paper Wars rules
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect-docx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print science unlock references from the archived discussions
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path

          ns = {'w': 'http://schemas.openxmlformats.org/wordprocessingml/2006/main'}
          terms = re.compile(
              r'наук|лаборатор|исслед|технолог|теплиц|дамб|рисов|хлоп|швейн|'
              r'одежд|горяч|термальн|поле.{0,8}II|саке|разведк|уровн.{0,10}наук|'
              r'наук.{0,10}(единиц|очк|уровн|пункт)',
              re.IGNORECASE
          )
          for path in sorted(Path('.').glob('VK_*.docx')):
              print(f'===== {path.name} =====')
              with zipfile.ZipFile(path) as archive:
                  root = ET.fromstring(archive.read('word/document.xml'))
                  paragraphs = []
                  for p in root.findall('.//w:p', ns):
                      value = ''.join(node.text or '' for node in p.findall('.//w:t', ns)).strip()
                      if value:
                          paragraphs.append(value)
                  for i, value in enumerate(paragraphs):
                      if terms.search(value):
                          print(f'P{i+1}: {value}')
          PY
