name: Inspect archived Paper Wars rules
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  inspect-docx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract research and construction rules from the archived discussions
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import zipfile
          import xml.etree.ElementTree as ET
          from pathlib import Path

          ns = {'w': 'http://schemas.openxmlformats.org/wordprocessingml/2006/main'}
          terms = re.compile(
              r'наук|исслед|теплиц|дамб|рисов|рисов|хлоп|ткац|рыб|охот|шахт|'
              r'фабрик|поле|мастерск|постро|здан|уровн|снос|удал|популяц|насел|'
              r'знани|технолог|производств|урожай|единиц',
              re.IGNORECASE
          )
          for path in sorted(Path('.').glob('VK_*.docx')):
              print(f'===== {path.name} =====')
              with zipfile.ZipFile(path) as archive:
                  root = ET.fromstring(archive.read('word/document.xml'))
                  paragraphs = []
                  for p in root.findall('.//w:p', ns):
                      value = ''.join(node.text or '' for node in p.findall('.//w:t', ns)).strip()
                      if value:
                          paragraphs.append(value)
                  shown = set()
                  for i, value in enumerate(paragraphs):
                      if terms.search(value):
                          for j in range(max(0, i - 1), min(len(paragraphs), i + 2)):
                              if j not in shown:
                                  shown.add(j)
                                  print(f'P{j+1}: {paragraphs[j]}')
                  media = [n for n in archive.namelist() if n.startswith('word/media/')]
                  print('MEDIA:', ', '.join(media))
          PY
